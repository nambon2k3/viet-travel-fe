name: DEPLOYMENT WORKFLOW
run-name: Deploy branch ${{ github.ref_name }} to production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Choose branch to deploy"
        required: true
        default: "dev"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Clean up temporary files
        run: |
          echo "Started cleaning up temporary files..."
          rm -rf /home/ubuntu/actions-runner/viet-travel/viet-travel-fe/viet-travel-fe/dist/viet-travel-fe/*

  build-n-deploy:
    runs-on: self-hosted
    needs: cleanup
    env:
      BUILD_FOLDER: /home/ubuntu/actions-runner/viet-travel/viet-travel-fe/viet-travel-fe/dist/viet-travel-fe
      DEPLOY_PATH: /var/www/viet-travel-fe
      NEW_FILE_NAME: fe-build
    steps:
      - name: Action checkout branch ${{ github.event.inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies needed
        run: |
          npm install

      - name: Build the project
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          npm run build:prod --verbose

      - name: Verify build folder
        run: |
          echo "Listing files in build directory:"
          ls -la $BUILD_FOLDER

      - name: Create build folder
        run: |
          sudo mkdir -p $DEPLOY_PATH
          sudo cp -r $BUILD_FOLDER/* $DEPLOY_PATH

      - name: Verify copied files
        run: |
          echo "Listing files in $DEPLOY_PATH:"
          ls -la $DEPLOY_PATH

      - name: Upload stubs to server
        uses: actions/upload-artifact@v4
        with:
          name: viettravelfe
          path: target/${{ env.NEW_FILE_NAME }}
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false
