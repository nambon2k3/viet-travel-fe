<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Add new Service</h2>
    <form>
        <div class="mb-4">
            <label for="image" class="block">Image</label>
            <div class="flex items-center">
                <input id="image" type="file" accept="image/*" class="input mr-2" (change)="onFileChange($event)" />
                <img *ngIf="imageUrl" [src]="imageUrl" alt="Image Preview" class="w-16 h-16 border" />
            </div>
        </div>

        <div class="mb-4 flex">
            <div class="flex-1 mr-2">
                <label for="name" class="block">Name</label>
                <input id="name" type="text" placeholder="Enter Name (e.g., Salute Premium Hotel & Spa)" class="input" />
            </div>
            <div class="flex-1 ml-2">
                <label for="abbreviation" class="block">Abbreviation</label>
                <input id="abbreviation" type="text" placeholder="Enter Abbreviation (e.g., Salute)" class="input" />
            </div>
        </div>

        <div class="mb-4 flex">
            <div class="flex-1 mr-2">
                <label for="email" class="block">Email</label>
                <input id="email" type="email" placeholder="Enter e-mail" class="input" />
            </div>
            <div class="flex-1 ml-2">
                <label for="phone" class="block">Phone</label>
                <input id="phone" type="tel" placeholder="Enter Phone Number" class="input" />
            </div>
        </div>

        <div class="mb-4">
            <label for="website" class="block">Website</label>
            <input id="website" type="url" placeholder="Enter your website link..." class="input" />
        </div>

        <div class="mb-4">
            <label for="address" class="block">Address</label>
            <input id="address" type="text" placeholder="Enter address" class="input" />
        </div>

        <div class="flex justify-end mt-4">
            <button type="button" (click)="onCancel()" class="bg-gray-300 text-black px-4 py-2 rounded-md">Cancel</button>
            <button type="submit" class="bg-black text-white px-4 py-2 rounded-md ml-2">Add Service</button>
        </div>
    </form>
</div>
