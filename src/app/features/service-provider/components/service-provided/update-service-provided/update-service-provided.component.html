<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Update Service</h2>

    <form [formGroup]="editServiceProvidedForm" (ngSubmit)="onSubmit()">
        <!-- Image Upload Section -->
        <div class="mb-4">
            <label for="image" class="block">Image</label>
            <div class="flex items-center">
                <!-- Hiển thị ảnh cũ từ database -->
                <img *ngIf="imagePreview" [src]="imagePreview" alt="Service Image" class="w-16 h-16 border mr-2" />

                <!-- Input chọn ảnh mới -->
                <input id="image" type="file" accept="image/*" class="input" (change)="onFileChange($event)" />

                <!-- Hiển thị ảnh mới nếu người dùng chọn -->
                <img *ngIf="imageUrl" [src]="imageUrl" alt="New Image Preview" class="w-16 h-16 border ml-2" />
            </div>
        </div>

        <!-- Service Name & Abbreviation -->
        <div class="mb-4 flex">
            <div class="flex-1 mr-2">
                <label for="name" class="block">Name</label>
                <input id="name" type="text" formControlName="name" class="input" placeholder="Enter Name" />
            </div>
            <div class="flex-1 ml-2">
                <label for="abbreviation" class="block">Abbreviation</label>
                <input id="abbreviation" type="text" formControlName="abbreviation" class="input" placeholder="Enter Abbreviation" />
            </div>
        </div>

        <!-- Email & Phone -->
        <div class="mb-4 flex">
            <div class="flex-1 mr-2">
                <label for="email" class="block">Email</label>
                <input id="email" type="email" formControlName="email" class="input" placeholder="Enter Email" />
            </div>
            <div class="flex-1 ml-2">
                <label for="phone" class="block">Phone</label>
                <input id="phone" type="tel" formControlName="phone" class="input" placeholder="Enter Phone Number" />
            </div>
        </div>

        <!-- Website -->
        <div class="mb-4">
            <label for="website" class="block">Website</label>
            <input id="website" type="url" formControlName="website" class="input" placeholder="Enter Website URL" />
        </div>

        <!-- Address -->
        <div class="mb-4">
            <label for="address" class="block">Address</label>
            <input id="address" type="text" formControlName="address" class="input" placeholder="Enter Address" />
        </div>

        <!-- Buttons -->
        <div class="flex justify-end mt-4">
            <button type="button" (click)="onCancel()" class="bg-gray-300 text-black px-4 py-2 rounded-md">Cancel</button>
            <button type="submit" class="bg-black text-white px-4 py-2 rounded-md ml-2">Update Service</button>
        </div>
    </form>
</div>
