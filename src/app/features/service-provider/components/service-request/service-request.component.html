<div class="mb-2 flex justify-between">
    <div class="inline-block">
      <h3 class="text-foreground font-semibold">List Requests</h3>
      <div class="text-muted-foreground space-x-1 text-xs font-medium">
        <a href="" class="hover:text-primary">All List Requests:</a>
        <span class="text-foreground">{{ totalItems}}</span>
      </div>
    </div>
    <app-spinner [isLoading]="isLoading"></app-spinner>
    
  </div>
  
  <div class="border-muted/20 bg-background flex min-w-full flex-col rounded-xl border p-2">
    <app-table-action 
    [totalItems]="totalItems"
    (onFilter)="onFilter($event)"
    [pageItems]="pageItemCount"
    ></app-table-action>
    <div
      class="scrollbar-thumb-rounded scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted grow overflow-x-auto px-5">
      <table
        class="text-muted-foreground table w-full table-auto border-collapse border-0 text-left align-middle leading-5">
        <thead class="border-muted/20 text-muted-foreground border text-xs">
          <tr app-table-header (onCheck)="toggleServiceContacts($event)"></tr>
        </thead>
        <tbody>
          <!-- @for (serviceRequest of filteredServiceContacts(); track $index) {
          <tr class="hover:bg-card/50" app-table-row [serviceRequest]="serviceRequest"></tr>
          } @empty { -->
          <tr>
            <td class="py-4 text-center text-sm" colspan="7">No Requests found</td>
          </tr>
          <!-- } -->
        </tbody>
      </table>
    </div>
    <app-table-footer
    [totalPages]="totalPages()"
    [currentPage]="page"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    ></app-table-footer>
  </div>
