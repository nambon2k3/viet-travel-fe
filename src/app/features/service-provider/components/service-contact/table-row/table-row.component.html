<ng-container>
  <td class="text-center">
    <input
      [(ngModel)]="serviceContact.id"
      class="checkbox checkbox-sm"
      data-datatable-row-check="true"
      type="checkbox"
      value="28" />
  </td>
  <td>{{ serviceContact.position }}</td>

  <td>{{ serviceContact.fullName }}</td>

  <td>
    {{ serviceContact.phoneNumber }}
  </td>

  <td>
    {{ serviceContact.email }}
  </td>

  <td>{{ serviceContact.gender }}</td>
  
  <td>
    {{ serviceContact.serviceProviderName }}
  </td>

  
  <td>
    <div  class="text-center flex justify-center items-center">

    <button 
      type="button" 
      class="text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
      (click)="onUpdate()">
      Update
    </button>
    
    <button 
      type="button" 
      class="text-white bg-red-700 hover:bg-red-800 focus:outline-none focus:ring-4 focus:ring-red-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-900"
      (click)="toggleServiceContact()">
      Delete
    </button>
    
    
    </div>
    
  </td>

  <!-- Overlay -->
  <div *ngIf="showPopup" class="fixed inset-0 bg-black opacity-50 z-40"></div>


  <!-- Popup -->
<div *ngIf="showPopup" class="fixed inset-0 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-lg font-bold mb-4">Are you sure you want to delete this Service?</h2>
    <div class="flex items-center mb-4">
      <input type="checkbox" [(ngModel)]="isChecked" id="agree" class="mr-2">
      <label for="agree">I Agree with terms and policy</label>
    </div>
    <div class="flex justify-end">
      <button (click)="onCancel()" class="text-gray-500 hover:text-gray-700 mr-2">Cancel</button>
      <button (click)="onConfirm()"  class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Confirm</button>
    </div>
  </div>
</div>


</ng-container>
