<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Update Service Contact</h2>
    <form>
        <div class="mb-4">
            <label for="fullname" class="block">Fullname</label>
            <input id="fullname" type="text" placeholder="Your Full Name (e.g., Than Thi Lan Anh)" class="input" />
        </div>

        <div class="flex mb-4">
            <div class="w-1/2 pr-1">
                <label for="email" class="block">Email</label>
                <input id="email" type="email" placeholder="Your e-mail" class="input" />
            </div>
            <div class="w-1/2 pl-1">
                <label for="phone" class="block">Phone</label>
                <input id="phone" type="tel" placeholder="Your Phone Number" class="input" />
            </div>
        </div>

        <div class="flex mb-4">
            <div class="w-1/2 pr-1">
                <label for="gender" class="block">Gender</label>
                <select id="gender" class="input">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="w-1/2 pl-1">
                <label for="position" class="block">Position</label>
                <input id="position" type="text" placeholder="Your Position" class="input" />
            </div>
        </div>

        <div class="mb-4">
            <label class="block">Name of Services</label>
            <div class="input bg-gray-200 text-gray-500 cursor-not-allowed" style="pointer-events: none;">
                Your Name of Services
            </div>
        </div>

        <div class="flex justify-end mt-4 space-x-2">
            <button type="button" (click)="onCancel()" class="px-4 py-2 text-gray-600 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
            <button type="submit" class="px-4 py-2 text-white bg-green-700 rounded-md hover:bg-green-700">Update Service Contact</button>
        </div>
    </form>
</div>
