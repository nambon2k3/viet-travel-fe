<div class="container">
  <h2 class="text-lg font-bold mb-4">Add Service Contact</h2>

  @if(isLoading) {
    <app-blog-loading></app-blog-loading>
  } @else {
    <form [formGroup]="addServiceContactForm">
      <!-- Position -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Position</label>
      <input type="text" formControlName="position" class="w-full p-2 border rounded-md mb-4" placeholder="Enter position" />
      
      <!-- Full Name -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Full Name</label>
      <input type="text" formControlName="fullName" class="w-full p-2 border rounded-md mb-4" placeholder="Enter full name" />

      <!-- Phone Number -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Phone Number</label>
      <input type="text" formControlName="phoneNumber" class="w-full p-2 border rounded-md mb-4" placeholder="Enter phone number" />

      <!-- Email -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Email</label>
      <input type="email" formControlName="email" class="w-full p-2 border rounded-md mb-4" placeholder="Enter email" />

      <!-- Gender -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Gender</label>
      <select formControlName="gender" class="w-full p-2 border rounded-md mb-4">
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
      </select>

      <!-- Service Provider Dropdown -->
      <label class="block mb-2 text-sm font-medium text-gray-700">Service Provider</label>
      <select formControlName="serviceProviderId" class="w-full p-2 border rounded-md mb-4">
        <option *ngFor="let provider of serviceProviders" [value]="provider.id">{{ provider.name }}</option>
      </select>

      <!-- Error & Success Messages -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm mb-3">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="text-green-500 text-sm mb-3">{{ successMessage }}</p>

      <!-- Action Buttons -->
      <div class="flex justify-end space-x-2">
        <button type="button" (click)="onCancel()" class="px-4 py-2 text-gray-600 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
        <button type="submit" (click)="saveChanges()" class="px-4 py-2 text-white bg-green-500 rounded-md hover:bg-green-600">Save Changes</button>
      </div>
    </form>
  }
</div>
