<div class="container">
  <h2 class="text-lg font-bold mb-4">Add Service Contact</h2>

  @if(isLoading) {
    <app-blog-loading></app-blog-loading>
  } @else {
    <form [formGroup]="addServiceContactForm">
      <!-- Full Name on its own row -->
      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" formControlName="fullName" class="w-full p-2 border rounded-md" placeholder="Enter full name" />
      </div>
    
      <!-- Email and Phone Number in one row -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700">Email</label>
          <input type="email" formControlName="email" class="w-full p-2 border rounded-md" placeholder="Enter email" />
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700">Phone Number</label>
          <input type="text" formControlName="phoneNumber" class="w-full p-2 border rounded-md" placeholder="Enter phone number" />
        </div>
      </div>
    
      <!-- Gender and Position in one row -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700">Gender</label>
          <select formControlName="gender" class="w-full p-2 border rounded-md">
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
          </select>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700">Position</label>
          <input type="text" formControlName="position" class="w-full p-2 border rounded-md" placeholder="Enter position" />
        </div>
      </div>
    
      <!-- Error & Success Messages -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm mb-3">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="text-green-500 text-sm mb-3">{{ successMessage }}</p>
    
      <!-- Action Buttons -->
      <div class="flex justify-end space-x-2">
        <button type="button" (click)="onCancel()" class="px-4 py-2 text-gray-600 bg-gray-200 rounded-md hover:bg-gray-300">Cancel</button>
        <button type="submit" (click)="saveChanges()" class="px-4 py-2 text-white bg-green-700 rounded-md hover:bg-green-700">Add new</button>
      </div>
    </form>
  }
</div>
