<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Add new Service Contact</h2>
    <form>
        <div class="mb-4">
            <label for="fullname" class="block">Fullname</label>
            <input id="fullname" type="text" placeholder="Enter your Full Name (e.g., Than Thi Lan Anh)" class="input" />
        </div>

        <div class="mb-4">
            <label for="email" class="block">Email</label>
            <input id="email" type="email" placeholder="Enter e-mail" class="input" />
        </div>

        <div class="flex mb-4">
            <div class="w-1/2 pr-1">
                <label for="phone" class="block">Phone</label>
                <input id="phone" type="tel" placeholder="Enter Phone Number" class="input" />
            </div>
            <div class="w-1/2 pl-1">
                <label for="website" class="block">Website</label>
                <input id="website" type="url" placeholder="Enter your website link..." class="input" />
            </div>
        </div>

        <div class="flex mb-4">
            <div class="w-1/2 pr-1">
                <label for="gender" class="block">Gender</label>
                <select id="gender" class="input">
                    <option value="">Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="w-1/2 pl-1">
                <label for="position" class="block">Position</label>
                <input id="position" type="text" placeholder="Your Position" class="input" />
            </div>
        </div>

        <div class="mb-4">
            <label for="services" class="block">Name of Services</label>
            <input id="services" type="text" placeholder="Enter your Name of Services here... (e.g., A Hotel)" class="input" />
        </div>

        <div class="flex justify-end mt-4">
            <button type="button" (click)="onCancel()" class="bg-gray-300 text-black px-4 py-2 rounded-md">Cancel</button>
            <button type="submit" class="bg-black text-white px-4 py-2 rounded-md ml-2">Add Service Contact</button>
        </div>
    </form>
</div>
