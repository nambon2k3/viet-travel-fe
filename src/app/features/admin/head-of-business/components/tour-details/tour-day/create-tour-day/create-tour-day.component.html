<div id="createTourDayModal" tabindex="-1" aria-hidden="true"
    class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center w-full h-full bg-gray-900 bg-opacity-50 hidden">
    <div class="relative w-full max-w-lg bg-white rounded-lg shadow-lg p-5">
        <div class="flex items-center justify-between px-6 py-4 border-b">
            <h3 class="text-lg font-semibold">Tạo Nhật Ký</h3>
            <button data-modal-hide="createTourDayModal" class="text-gray-500 hover:text-gray-700">
                ✖
            </button>
        </div>
        <form class="space-y-4" [formGroup]="editTourForm" (ngSubmit)="onSubmit()">
            <div>
                <label class="block mb-1 font-bold">Ngày</label>
                <input type="number" value="1" class="w-full p-2 bg-gray-300 border rounded" readonly>
            </div>

            <div>
                <label class="block mb-1 font-bold">Tiêu Đề Ngày Tour</label>
                <input type="text" formControlName="title" class="w-full p-2 border rounded"
                    placeholder="e.g., Hà Nội - Tuần Chùa">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 font-bold">Bữa Ăn</label>
                    <input type="text" formControlName="mealPlan" class="w-full p-2 border rounded"
                        placeholder="e.g., Bữa sáng, Bữa trưa, Bữa tối">
                </div>

                <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                    class="inline-flex items-center px-4 py-2 text-sm font-medium text-center text-white bg-green-700 rounded-lg hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800"
                    type="button">Dropdown button <svg class="w-2.5 h-2.5 ms-3" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 1 4 4 4-4" />
                    </svg>
                </button>
            </div>

            <div class="w-1/2">
                <label class="block mb-1 font-bold">Điểm khởi hành</label>
                <ng-select class="custom bg-white border border-gray-300 rounded-md" formControlName="locationId"
                    [items]="dropdownList" bindLabel="name" bindValue="id" placeholder="Chọn địa điểm"
                    [searchable]="true" (search)="onSearch($event)">
                </ng-select>
                <span *ngIf="editTourForm.get('locationId')?.invalid && editTourForm.get('locationId')?.touched"
                    class="text-red-500 text-sm">
                    Vui lòng chọn địa điểm
                </span>
            </div>

            <div>
                <label class="block mb-1 font-bold">Nội Dung</label>
                <textarea formControlName="content" class="w-full p-2 border rounded" rows="5"
                    placeholder="Mô tả chi tiết ngày tour..."></textarea>
            </div>

            <div class="flex justify-end space-x-4">
                <button type="button" data-modal-hide="createTourDayModal"
                    class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded">Hủy
                    Bỏ</button>
                <button type="submit" class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white rounded">Cập Nhật Hoạt
                    Động Tour</button>
            </div>
        </form>
    </div>
</div>
