<div id="createBookingModal" tabindex="-1" aria-hidden="true"
    class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg max-w-2xl w-full">
        <h3 class="text-lg font-semibold mb-4 border-b pb-2">Thêm mới thông tin người dùng đặt chỗ</h3>

        <form [formGroup]="bookingForm">
            <!-- Tên Tour -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-1">Tên Tour:</label>
                <input type="text" formControlName="tourName" class="w-full p-2 border rounded bg-gray-100" readonly>
            </div>

            <!-- Ngày mở -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-1">Ngày mở:</label>
                <input type="date" formControlName="openDate" class="w-full p-2 border rounded bg-gray-100" readonly>
            </div>

            <!-- Tên khách hàng -->
            <div class="mb-4">
                <label class="block text-gray-700 mb-1">Tên khách hàng:</label>
                <input type="text" formControlName="customerName" class="w-full p-2 border rounded">
                <span *ngIf="bookingForm.get('customerName')?.invalid && bookingForm.get('customerName')?.touched"
                    class="text-red-500 text-sm">Tên khách hàng ít nhất 3 ký tự</span>
            </div>

            <!-- Số điện thoại & Email -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 mb-1">Số điện thoại:</label>
                    <input type="text" formControlName="phoneNumber" class="w-full p-2 border rounded">
                    <span *ngIf="bookingForm.get('phoneNumber')?.invalid && bookingForm.get('phoneNumber')?.touched"
                        class="text-red-500 text-sm">SĐT phải có 10 chữ số</span>
                </div>
                <div>
                    <label class="block text-gray-700 mb-1">Email:</label>
                    <input type="email" formControlName="email" class="w-full p-2 border rounded">
                    <span *ngIf="bookingForm.get('email')?.invalid && bookingForm.get('email')?.touched"
                        class="text-red-500 text-sm">Email không hợp lệ</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex justify-end space-x-4">
                <button type="button" data-modal-hide="createBookingModal"
                    class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded">Huỷ</button>
                <button type="submit" (click)="confirmBooking()" data-modal-hide="createBookingModal"
                    class="px-4 py-2 bg-green-700 hover:bg-green-800 text-white rounded">Xác nhận</button>
            </div>
        </form>
    </div>
</div>
