<ng-container>
  <td>{{ tour.tourName }}</td>

  <td>
    {{ tour.startDate | formatDate }}
  </td>

  <td>
    {{ tour.slot }} / 40
  </td>

  <td>
    {{ tour.Operator.fullName }}
  </td>

  <td>
    {{ tour.status }}
  </td>

  <td>
    {{ tour.TourGuide.fullName }}
  </td>

  <td>
    <div class="text-center flex justify-center items-center">
      <button type="button"
        class="text-white w-24 bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
        (click)="openDetail(tour)">
        Chi tiết
      </button>
      <button type="button"
        class="text-white w-28 bg-green-700 hover:bg-green-800 focus:outline-none focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800"
        (click)="openTourOperation(tour)">
        Điều hành
      </button>
    </div>
  </td>
</ng-container>
