<div class="flex justify-end items-end">
    <div class="space-x-2">
        <button (click)="backToList()" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">Quay lại danh sách</button>
        <button data-modal-target="popup-modal" data-modal-toggle="popup-modal" type="button"
            class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded">Gán hoạt động</button>
    </div>
</div>

<div class="bg-gray-100 shadow-md w-full mt-2 p-4">
    <div class="text-lg font-semibold">
        <span class="text-red-600 font-bold">MS001</span>
        <span class="font-bold">_ Đà Nẵng -
            Huế - Bà Nà - Hội An</span>
        <span class="ml-4 font-bold">Thời gian khởi hành: 02/02/2025</span>
    </div>
    <nav class=" flex justify-between px-8 space-x-6 mt-4 text-gray-600">
        <a [routerLink]="['/operator/tour-operation/overview']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Tổng
            quan</a>
        <a [routerLink]="['/operator/tour-operation/list-customer']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Danh sách khách hàng</a>
        <a [routerLink]="['/operator/tour-operation/list-booking']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Danh sách đặt chỗ</a>
        <a [routerLink]="['/operator/tour-operation/service']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Dịch vụ</a>
        <a [routerLink]="['/operator/tour-operation/transaction']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Giao dịch</a>
        <a [routerLink]="['/operator/tour-operation/log']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Nhật ký hoạt động</a>
        <a [routerLink]="['/operator/tour-operation/summary']" routerLinkActive="border-b-4 border-green-700 font-semibold" class="hover:text-black">Tổng kết</a>
    </nav>
</div>

<div id="popup-modal" tabindex="-1"
    class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-md max-h-full">
        <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
            <button type="button"
                class="absolute top-3 end-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                data-modal-hide="popup-modal">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                </svg>
                <span class="sr-only">Thoát</span>
            </button>
            <div class="p-4 md:p-5 text-center">
                <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <h3 class="mb-5 text-lg font-normal text-gray-500 dark:text-gray-400">Bạn có chắc chắn muốn điều hành
                    cho tour này?</h3>
                <button data-modal-hide="popup-modal" type="button"
                    class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center">
                    Có, tôi chắc chắn
                </button>
                <button data-modal-hide="popup-modal" type="button"
                    class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">Không,
                    hủy</button>
            </div>
        </div>
    </div>
</div>
<router-outlet></router-outlet>
