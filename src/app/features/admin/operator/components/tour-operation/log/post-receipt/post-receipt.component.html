<div class="max-w-3xl">
    <h2 class="text-xl font-semibold mb-4">Add Receipt / Receipt Detail</h2>

    <form [formGroup]="receiptForm">
        <!-- Grid Layout for Form -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Tour Booking ID (Full width) -->
            <div class="col-span-2">
                <p><strong>Tour Booking ID:</strong> {{ receiptForm.get('tourBookingId')?.value }}</p>
            </div>

            <!-- Tour Booking Name -->
            <div class="col-span-2">
                <label class="block text-gray-600">Tour Booking Name:</label>
                <input type="text" formControlName="tourBookingName"
                    class="mt-1 w-full border px-3 py-2 rounded-lg bg-white">
            </div>

            <!-- Pay For -->
            <div>
                <label class="block text-gray-600">Pay for:</label>
                <input type="text" formControlName="payFor" class="w-full border px-3 py-2 rounded-lg bg-white">
            </div>

            <!-- Receipt ID and Created Date -->
            <div>
                <p class="text-lg mt-8"><strong>Receipt ID:</strong> {{ receiptForm.get('receiptId')?.value }}</p>
            </div>

            <!-- Payer -->
            <div>
                <label class="block text-gray-600">Payer:</label>
                <input type="text" formControlName="payer" class="w-full border px-3 py-2 rounded-lg bg-white">
            </div>
            
            <div class="">
                <label class="block text-gray-600">Created Date:</label>
                <input type="date" formControlName="createdDate" readonly
                    class="w-full border px-3 py-2 rounded-lg cursor-not-allowed">
            </div>


            <!-- Email (Full width) -->
            <div class="">
                <label class="block text-gray-600">Email:</label>
                <input type="email" formControlName="email" class="w-full border px-3 py-2 rounded-lg bg-white">
            </div>

            
            <!-- Accounted Date -->
            <div>
                <label class="block text-gray-600">Accounted Date:</label>
                <input type="date" formControlName="accountedDate" class="w-full border px-3 py-2 rounded-lg">
            </div>

            <!-- Accountant -->
            <div>
                <label class="block text-gray-600">Accountant:</label>
                <input type="text" formControlName="accountant" class="w-full border px-3 py-2 rounded-lg bg-white">
            </div>

            <div class=""></div>

            <!-- Type -->
            <div>
                <label class="block text-gray-600">Type:</label>
                <select formControlName="type" class="w-full border px-3 py-2 rounded-lg">
                    <option value="Pay">Pay</option>
                    <option value="Receive">Receive</option>
                </select>
            </div>

            <!-- Method -->
            <div>
                <label class="block text-gray-600">Method:</label>
                <select formControlName="method" class="w-full border px-3 py-2 rounded-lg">
                    <option value="Cash">Cash</option>
                    <option value="Transfer">Transfer</option>
                </select>
            </div>

            <!-- Note (Full width) -->
            <div class="col-span-2">
                <label class="block text-gray-600">Note:</label>
                <textarea formControlName="note" class="w-full border px-3 py-2 rounded-lg bg-white"></textarea>
            </div>
        </div>

        <!-- Payment Breakdown Table (Full width) -->
        <div class="mt-6 text-sm">
            <table class="w-full border border-gray-300 rounded-lg overflow-hidden">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-2 border">No</th>
                        <th class="p-2 border">Content</th>
                        <th class="p-2 border">Amount</th>
                        <th class="p-2 border">Action</th>
                    </tr>
                </thead>
                <tbody formArrayName="paymentRows">
                    <tr class="border" *ngFor="let row of paymentRows.controls; let i = index" [formGroupName]="i">
                        <td class="p-2 text-center">{{ i + 1 }}</td>
                        <td class="p-2">
                            <input type="text" formControlName="content" placeholder="Enter content"
                                class="w-full px-2 py-1 border rounded">
                        </td>
                        <td class="p-2 text-right">
                            <input type="number" formControlName="amount" placeholder="0"
                                class="w-full px-2 py-1 border rounded text-right">
                        </td>
                        <td class="p-2 text-center">
                            <button (click)="deletePaymentRow(i)" class="text-red-600 hover:text-red-800">❌</button>
                        </td>
                    </tr>
                </tbody>
                <tfoot class="bg-gray-200">
                    <tr>
                        <td colspan="2" class="p-2 font-semibold">Total Amount:</td>
                        <td class="p-2 text-right">{{ getTotalAmount() | currencyVnd }}</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Add Row Button (Full width) -->
        <div class="mt-4 flex items-center text-blue-600 cursor-pointer" (click)="addPaymentRow()">
            <span class="text-xl">➕</span>
            <span class="ml-2">Add row</span>
        </div>

        <!-- Buttons (Full width) -->
        <div class="mt-6 flex justify-end space-x-4">
            <button type="button" class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300"
                (click)="onCancel()">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700"
                (click)="onSave()">
                Save
            </button>
            <button type="submit" class="px-4 py-2 text-white bg-green-600 rounded-lg hover:bg-green-700"
                (click)="onReceive()">
                Receive
            </button>
        </div>
    </form>
</div>
