<div id="paymentModal" tabindex="-1" aria-hidden="true"
  class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center w-full h-full bg-gray-900 bg-opacity-50 hidden">
  <div class="relative w-full max-w-lg bg-white rounded-lg shadow-lg">
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h3 class="text-lg font-semibold">Payment Request</h3>
      <button data-modal-hide="paymentModal" class="text-gray-500 hover:text-gray-700">
        ✖
      </button>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="paymentForm" (ngSubmit)="sendPayment()">
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <!-- Amount -->
          <div>
            <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
            <input type="text" id="amount" formControlName="amount"
              class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300" />
          </div>

          <!-- Method -->
          <div>
            <label for="method" class="block text-sm font-medium text-gray-700">Method</label>
            <select id="method" formControlName="method"
              class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300">
              <option>Transfer</option>
              <option>Cash</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <!-- Service Provider -->
          <div>
            <label for="provider" class="block text-sm font-medium text-gray-700">Service Provider</label>
            <input type="text" id="provider" formControlName="provider"
              class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300" />
          </div>

          <!-- Payment Term -->
          <div>
            <label for="paymentTerm" class="block text-sm font-medium text-gray-700">Payment Term</label>
            <input type="date" id="paymentTerm" formControlName="paymentTerm"
              class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300" />
          </div>
        </div>

        <!-- Payment Reason -->
        <div>
          <label for="reason" class="block text-sm font-medium text-gray-700">Payment Reason</label>
          <textarea id="reason" rows="2" formControlName="reason"
            class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300"></textarea>
        </div>

        <!-- Banking Account -->
        <div>
          <label for="bank" class="block text-sm font-medium text-gray-700">Banking Account</label>
          <input type="text" id="bank" formControlName="bank"
            class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300" />
        </div>

        <!-- Notify Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Notify Email</label>
          <input type="email" id="email" formControlName="email"
            class="w-full px-3 py-2 mt-1 border rounded-lg focus:ring focus:ring-blue-300" />
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex justify-end px-6 py-4 border-t">
        <button type="button" data-modal-hide="paymentModal"
          class="px-4 py-2 mr-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">
          Cancel
        </button>
        <button type="submit" class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700">
          Send Request
        </button>
      </div>
    </form>
  </div>
</div>
