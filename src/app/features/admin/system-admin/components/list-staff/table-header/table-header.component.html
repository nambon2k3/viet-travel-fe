<ng-container class=" overflow-scroll">

    <input (change)="toggle($event)" class="checkbox checkbox-sm" data-datatable-check="true" type="checkbox" />
  </th>
  <th class="min-w-[100px]">ID</th>
  <th class="min-w-[180px]">FullName</th>
  <th class="min-w-[180px]">Username</th>
  <th class="min-w-[180px]">Email</th>
  <th class="min-w-[150px]">Gender</th>
  <th class="min-w-[150px]">Phone</th>
  <th class="min-w-[180px]">Address</th>
  <th class="min-w-[180px]">Role</th>
  <th class="min-w-[150px]">Created Date</th>
  <th class="w-[60px]">Action</th>
</ng-container>
