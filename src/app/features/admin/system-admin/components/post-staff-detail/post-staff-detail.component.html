<h2 class="text-lg font-bold mb-4">Edit Staff</h2>

<form [formGroup]="editUserForm">

    <!-- Id -->
    <input type="hidden" formControlName="id" readonly class="w-full p-2 border rounded-md mb-4"
        placeholder="Enter Id" />

    <!-- Avatar Image -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Avatar Image</label>
    <div class="flex flex-col items-center justify-center mb-4">
        <!-- Image Preview -->
        <img *ngIf="imagePreview" [src]="imagePreview" alt="Avatar Preview" class="w-20 h-20 rounded-full mb-4" />
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="w-full" />
    </div>

    <!-- Username -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Username</label>
    <input type="text" formControlName="username" class="w-full p-2 border rounded-md mb-4"
        placeholder="Enter Username" />

    <!-- Password -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Password</label>
    <input type="text" formControlName="password" class="w-full p-2 border rounded-md mb-4"
        placeholder="Enter New Password" />

    <!-- Fullname -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Fullname</label>
    <input type="text" formControlName="fullName" class="w-full p-2 border rounded-md mb-4"
        placeholder="Enter Full Name" />

    <!-- Email -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Email</label>
    <input type="email" formControlName="email" class="w-full p-2 border rounded-md mb-4" placeholder="Enter Email" />

    <!-- Gender -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Gender</label>
    <select formControlName="gender" class="w-full p-2 border rounded-md mb-4">
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
    </select>


    <!-- Phone -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Phone</label>
    <input type="text" formControlName="phone" class="w-full p-2 border rounded-md mb-4" placeholder="Enter Phone" />

    <!-- Address -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Address</label>
    <input type="text" formControlName="address" class="w-full p-2 border rounded-md mb-4"
        placeholder="Enter Address" />

    <!-- Role -->
    <label class="block mb-2 mt-3 text-sm font-medium text-gray-700">Roles</label>
    <ng-multiselect-dropdown id="selector" formControlName="roleNames" [settings]="dropdownSettings"
        [data]="dropdownList" [ngModel]="selectedItems" (onSelect)="onItemSelect($event)"
        (onSelectAll)="onSelectAll($event)" (onDeSelect)="onDeSelect($event)">
    </ng-multiselect-dropdown>



    <!-- Status -->
    <label class="block mb-2 text-sm font-medium text-gray-700">Status</label>
    <select formControlName="status" class="w-full p-2 border rounded-md mb-4">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
    </select>


    <!-- Error Message -->
    <p *ngIf="errorMessage" class="text-red-500 text-sm mb-3">
        {{ errorMessage }}
    </p>
    <p *ngIf="successMessage" class="text-green-500 text-sm mb-3">
        {{ successMessage }}
    </p>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-2">
        <button type="button" class="px-4 py-2 text-gray-600 bg-gray-200 rounded-md hover:bg-gray-300"
            (click)="onCancel()">
            Cancel
        </button>
        <button type="submit" (click)="saveChanges()"
            class="px-4 py-2 text-white bg-green-500 rounded-md hover:bg-green-600">
            Save
        </button>
    </div>
</form>
