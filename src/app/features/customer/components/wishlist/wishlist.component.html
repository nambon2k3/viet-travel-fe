<!-- Modal Wishlist -->
<div id="wishlistModal" tabindex="-1" aria-hidden="true"
    class="fixed inset-0 z-50 hidden w-full h-full flex justify-end">
    <div
        class="bg-white right-0 bottom-0 w-1/3 mt-32 h-full pb-20 shadow-lg px-6 overflow-y-auto transform transition-transform duration-300 ease-in-out translate-x-full">

        <!-- Phần tiêu đề cố định -->
        <div class="sticky top-0 bg-white z-10 py-6 mb-3">
            <button data-modal-hide="wishlistModal" class="absolute top-4 right-4 text-gray-600 hover:text-black">
                <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 class="text-lg font-semibold">Tour yêu thích</h2>
            <hr class="my-2 border-gray-300">
        </div>

        <!-- Danh sách Wishlist -->
        <div *ngFor="let tour of wishlist; let i = index"
            class="flex items-center bg-gray-100 rounded-lg m-4 p-4 hover:shadow-md">
            <img [src]="tour.imageUrl" alt="Tour Image" class="w-40 h-40 object-cover rounded-md bg-blue-300" />
            <div class="ml-4 flex-1">
                <p class="text-lg font-semibold">{{ tour.name }}</p>
                <p class="text-md text-gray-500">{{ tour.location }}</p>
            </div>
            <button class="text-gray-500 hover:text-black">
                <span class="text-lg">
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m15 9-6 6m0-6 6 6m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                </span>
            </button>
        </div>
    </div>
</div>
