<div class="relative ml-3">
    <!-- Profile Button -->
    <button (click)="toggleMenu()" class="bg-card relative flex rounded-full text-sm" type="button">
      <span class="sr-only">Mở menu người dùng</span>
      <img
        clickOutside
        (clickOutside)="isOpen = false"
        class="h-9 w-9 rounded-full"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUs8rjHsbBmOAkXL-4lZk9oaUNdAUD64enNQ&s"
        alt="" />
    </button>
    <!-- Dropdown -->
    <div
      [@openClose]="isOpen ? 'open' : 'closed'"
      class="bg-background shadow-custom absolute right-0 z-20 mt-2 w-60 origin-top-right transform rounded-sm py-4 ring-1 ring-transparent ring-opacity-5 transition focus:outline-hidden">
      <div class="flext-row flex items-center px-4 pb-4">
        <div class="w-10 shrink-0">
          <img class="h-9 w-9 rounded-full mr-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUs8rjHsbBmOAkXL-4lZk9oaUNdAUD64enNQ&s" alt="" />
        </div>
        <div class="text-foreground overflow-hidden px-2 text-sm font-semibold">
            Quản lý
          <p class="text-muted-foreground truncate text-ellipsis text-xs font-semibold">day la email</p>
        </div>
      </div>
  
      <div class="border-border border-b border-dashed"></div>
  
      <ul class="my-2 mx-4 flex flex-col">
        @for (item of profileMenu; track $index) {
        <li
          routerLink="{{ item.link }}"
          :key="$index"
          class="text-muted-foreground hover:bg-card hover:text-primary inline-flex cursor-pointer items-center gap-2 rounded-sm px-3 py-2 text-xs font-semibold">
          <svg-icon src="{{ item.icon }}" [svgClass]="'h-5 w-5 text-muted-foreground/50'"> </svg-icon>
          {{ item.title }}
        </li>
        }
      </ul>
      <hr class="border-border border-dashed" />
    </div>
  </div>
